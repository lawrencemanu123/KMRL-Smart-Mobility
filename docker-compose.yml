version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kmlr-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kmlr_user:kmlr_password@postgres:5432/kmlr_db
      - SECRET_KEY=kmlr-kochi-transit-super-secret-jwt-key-2026
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kmlr-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    container_name: kmlr-postgres
    restart: always
    environment:
      POSTGRES_USER: kmlr_user
      POSTGRES_PASSWORD: kmlr_password
      POSTGRES_DB: kmlr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kmlr-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
